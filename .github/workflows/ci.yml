name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest

      - name: Import smoke test (no API key, mock mode)
        env:
          SARVAM_API_KEY: ""
        run: python -c "from core import config, db, events, i18n, ui; print(config.provider_mode()); db.init_db(); events.log_event('app_opened')"
